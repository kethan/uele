# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            # vitest enforces 100% coverage (statements/branches/functions/lines) on every shipped module
            - run: npm run test:coverage
            - run: npm run test:core
            # the same behavioural suites against the built ESM and CJS output
            - run: npm run test:bundles
            - run: npm run test:types
            - run: npm run audit:release
            # every shipped bundle has a raw and gzip budget
            - run: npm run size
            - run: npm run size:core
            - run: npm run size:apps
            - uses: actions/upload-artifact@v4
              with:
                  name: runnable-app-size-proofs
                  path: |
                      examples/size-proof/results.json
                      examples/size-proof/dist/*.js
                      examples/size-proof/dist/*.js.gz
            # packs the tarball, installs it in a clean project, checks exports and published types
            - run: npm run test:pack
            # Chromium (binary pinned via @sparticuz/chromium) links libnspr4/libnss3 at launch
            - run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3
            # real-browser pass: boots the built bundles in Chromium, axe-checked
            - run: npm run test:browser
            # Standalone Vite starter: local checkout, development + production browser checks
            - run: npm ci --prefix examples/vite-starter
            - run: npm run build --prefix examples/vite-starter
            - run: npm run test:starter
